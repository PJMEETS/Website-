<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJMeets LLC</title>
<meta name="description" content="PJMeets LLC is an independent mobile game studio based in Portland, Oregon.">
<style>
  :root{
    --bg:#fbf7f2; --ink:#1f1b2e; --muted:#5f5a6b; --accent:#e4572e; --card:#ffffff; --line:#eadfd3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16141c; --ink:#f3eee8; --muted:#b4adbd; --accent:#ff7a50; --card:#201d28; --line:#332e3d; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    max-width:640px;margin:0 auto;padding:48px 20px}
  .mark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:.5px;margin-bottom:28px}
  h1{font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
  .tag{font-size:1.2rem;color:var(--muted);margin:0 0 36px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px}
  .card h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600}
  .card a{color:var(--accent);font-weight:600;font-size:1.1rem;text-decoration:none;word-break:break-all}
  .card a:hover{text-decoration:underline}
  footer{margin-top:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">PJ</div>
  <h1>PJMeets LLC</h1>
  <p class="tag">An independent mobile game studio based in Portland, Oregon. New games coming soon.</p>
  <div class="card">
    <h2>Contact</h2>
    <a href="mailto:zevadeclercque@pjmeets.com">zevadeclercque@pjmeets.com</a>
  </div>
  <footer>&copy; 2026 PJMeets LLC. All rights reserved.</footer>
</main>
</body>
</html>
